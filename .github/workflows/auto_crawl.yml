name: AFK Journey Coupon Auto Crawler

on:
  schedule:
    - cron: '0 */6 * * *' # 6시간마다 자동 실행
  workflow_dispatch: # 수동 실행 버튼

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install requests beautifulsoup4 cloudscraper urllib3

      - name: 크롤러 실행
        run: python crawler.py

      - name: 결과 파일 저장 및 푸시
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update afk_journey.json with web search"
          file_pattern: "afk_journey.json"
