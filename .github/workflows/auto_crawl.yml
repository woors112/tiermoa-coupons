name: AFK Journey Coupon Auto Crawler

on:
  schedule:
    # 한국 시간(KST) 기준 00:00, 06:00, 12:00, 18:00에 실행 (UTC 15:00, 21:00, 03:00, 09:00)
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  build:
    runs-running: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install cloudscraper beautifulsoup4
      - name: Run Crawler
        run: python crawler.py
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add afk_journey.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update coupons" && git push)
