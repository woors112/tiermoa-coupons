name: Tiermoa Multi Game Coupon Crawler

on:
  schedule:
    - cron: '0 15,21,3,9 * * *' # KST 기준 00시, 06시, 12시, 18시 자동 실행
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper

      - name: Run Crawler Script
        run: python crawler.py

      - name: Commit and Push updated JSON files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add *.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update game coupons [KST]" && git push)
